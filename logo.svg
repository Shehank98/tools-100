<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" role="img" aria-label="OneKit logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Icon box -->
  <rect x="0" y="4" width="40" height="40" rx="10" fill="url(#logoGrad)"/>
  <!-- Wrench shape -->
  <path d="M27 13a7 7 0 00-6.93 8.07L12 29.14 14.86 32l8.07-8.07A7 7 0 1027 13z" fill="white"/>
  <circle cx="27" cy="20" r="3.5" fill="url(#logoGrad)"/>
  <!-- Wordmark — indigo works on both light and dark backgrounds -->
  <text x="52" y="32" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="800" fill="#6366f1" letter-spacing="-0.5">One<tspan fill="#8b5cf6">Kit</tspan></text>
</svg>
